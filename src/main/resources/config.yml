# ==============================================================================
#                       КОНФИГУРАЦИЯ ПЛАГИНА НАКАЗАНИЙ
#                             CustomPunish 26.2
# ==============================================================================

# ------------------------------------------------------------------------------
# Настройка лимитов времени в LuckPerms (через /lp editor)
# ------------------------------------------------------------------------------
# Вам НЕ нужно прописывать группы в этом конфиге!
# Вы сами выбираете и настраиваете любой лимит для любой привилегии в /lp editor.
#
# Плагин поддерживает 2 удобных способа настройки в lp editor для любой группы:
#
# С ПО С О Б  1  (Через список прав группы):
#   Просто добавьте в группу в редакторе нужное право с указанием времени:
#     - Лимит на бан: punish.limit.ban.<время>
#       Примеры: punish.limit.ban.30m
#                punish.limit.ban.10d
#                punish.limit.ban.permanent (или punish.ban.permanent)
#
#     - Лимит на мут: punish.limit.mute.<время>
#       Примеры: punish.limit.mute.1h
#                punish.limit.mute.14d
#                punish.limit.mute.permanent
#
# С ПО С О Б  2  (Через вкладку "Meta" в lp editor):
#   Перейдите во вкладку Meta нужной группы и добавьте ключ и значение:
#     - max-ban : 30m   (или 10d, 3d, 1h, permanent)
#     - max-mute : 1h   (или 14d, 2h, permanent)
#
# Безопасность:
#   Если у роли есть право на /ban или /mute, но лимит в LuckPerms для нее
#   не указан, плагин заблокирует выполнение команды и попросит обратиться к администратору.
#   Администраторы с правом punish.admin или OP не имеют ограничений.
# ------------------------------------------------------------------------------

# Команды, которые блокируются во время мута (защита от обхода через ЛС)
blocked-commands-on-mute:
  - "msg"
  - "tell"
  - "w"
  - "r"
  - "reply"
  - "whisper"
  - "me"

# Причина по умолчанию, если модератор не указал причину
default-reason: "Нарушение правил сервера"

# Популярные причины для автодополнения (Tab Complete)
suggested-reasons:
  - "Читы / Запрещенное ПО"
  - "Оскорбления / Неадекватность"
  - "Упоминание родственников"
  - "Спам / Флуд"
  - "Реклама сторонних ресурсов"
  - "Гриферство / Помеха игре"
  - "Мошенничество"

# Радиус локального чата в блоках (для отправки сообщения о попытке говорить)
local-chat-radius: 100

# ------------------------------------------------------------------------------
# Настройка сообщений и экранов
# Поддерживаются как классические коды цвета (&c, &l, &#RRGGBB),
# так и теги Adventure MiniMessage (<red>, <bold>, <gradient:#ff5555:#ffaa00>).
#
# Доступные плейсхолдеры:
#   {player}     — имя нарушителя (или IP)
#   {ip}         — IP-адрес игрока
#   {operator}   — имя модератора
#   {reason}     — причина наказания
#   {duration}   — длительность (например: 10 дн. 4 ч. или Навсегда)
#   {created_at} — дата и время выдачи
#   {expires_at} — дата и время окончания
#   {remaining}  — оставшееся время до окончания
# ------------------------------------------------------------------------------
messages:

  # Экран блокировки при попытке входа на сервер
  screens:
    ban:
      - "&c&l=============================================="
      - "&c&l            ВЫ ЗАБЛОКИРОВАНЫ НА СЕРВЕРЕ"
      - "&c&l=============================================="
      - ""
      - "&fПричина: &e{reason}"
      - "&fЗаблокировал: &b{operator}"
      - "&fСрок блокировки: &e{duration}"
      - "&fДата окончания: &7{expires_at}"
      - ""
      - "&7Если вы считаете наказание ошибочным, подайте апелляцию:"
      - "&bvk.com/your_server_appeals"
      - "&c&l=============================================="

    # Экран исключения при /kick
    kick:
      - "&c&l=============================================="
      - "&c&l          ВЫ БЫЛИ ИСКЛЮЧЕНЫ С СЕРВЕРА"
      - "&c&l=============================================="
      - ""
      - "&fПричина: &e{reason}"
      - "&fИсключил: &b{operator}"
      - ""
      - "&7Пожалуйста, соблюдайте правила сервера!"
      - "&c&l=============================================="

    # Сообщение при попытке писать в чат во время мута (лично нарушителю)
    mute-chat:
      - "&c&l[!] &cВы не можете отправлять сообщения в чат!"
      - "&7Причина: &e{reason} &8| &7Осталось: &e{remaining}"

  # Сообщение в локальный чат для окружающих игроков, когда замученный пытается говорить
  chat-mute-attempt: "&8* {player} пытается что-то сказать *"

  # Оповещения в общий чат о выданных наказаниях
  broadcast:
    ban: "&c[Наказания] &fИгрок &e{player} &fбыл &cзаблокирован &fмодератором &b{operator}&f. Причина: &e{reason} &7({duration})"
    banip: "&4[Наказания] &fИгрок &e{player} &fбыл &4заблокирован по IP &fмодератором &b{operator}&f. Причина: &e{reason} &7({duration})"
    mute: "&6[Наказания] &fИгрок &e{player} &fбыл &6лишен чата &fмодератором &b{operator}&f. Причина: &e{reason} &7({duration})"
    kick: "&e[Наказания] &fИгрок &e{player} &fбыл &eисключен &fмодератором &b{operator}&f. Причина: &e{reason}"
    warn: "&c[Наказания] &e{player} &fполучил варн &e[{count}/3]&f от модератора &b{operator}&f. Причина: &e{reason}"
    unban: "&a[Наказания] &b{operator} &fразблокировал игрока &e{player}&f. Причина: &7{reason}"
    unbanip: "&a[Наказания] &b{operator} &fразблокировал IP &e{ip}&f. Причина: &7{reason}"
    unmute: "&a[Наказания] &b{operator} &fснял блокировку чата с &e{player}&f. Причина: &7{reason}"
    unwarn: "&a[Наказания] &b{operator} &fснял варн с игрока &e{player}&f. Причина: &7{reason}"

    # Тихий режим (флаг -s) — отправляется только персоналу с правом punish.notifications
    silent:
      ban: "&8[&7Тихо&8] &e{player} &7заблокирован модератором &b{operator}&7. Причина: &f{reason} &8({duration})"
      banip: "&8[&7Тихо&8] &e{player} &7заблокирован по IP модератором &b{operator}&7. Причина: &f{reason} &8({duration})"
      mute: "&8[&7Тихо&8] &e{player} &7замучен модератором &b{operator}&7. Причина: &f{reason} &8({duration})"
      kick: "&8[&7Тихо&8] &e{player} &7исключен модератором &b{operator}&7. Причина: &f{reason}"
      warn: "&7[Тихо] &e{player} &7получил варн &e[{count}/3]&7 от &b{operator}&7. Причина: &f{reason}"

  # Личные уведомления игроку
  notification:
    mute-received:
      - "&c&m----------------------------------------"
      - "&c&lВам заблокировали доступ к чату!"
      - "&fМодератор: &b{operator}"
      - "&fПричина: &e{reason}"
      - "&fСрок: &e{duration}"
      - "&c&m----------------------------------------"
    unmuted: "&aС вас была снята блокировка чата. Приятной игры!"
    warn-received-chat: "&cВы получили варн &e[{count}/3]&c от &b{operator}&c. Причина: &f{reason}"
    unwarned: "&aС вас было снято предупреждение. Причина: &7{reason}"
    offline-punishment: "&cАдминистратор &b{operator} &cВыдал вам в оффлайне &e{type}&c Причина: &f{reason}&c. Истекает через: &e{remaining}"

  # Подсказки по использованию команд
  usage:
    ban: "&6Использование: &e/ban <игрок> [срок] [причина] [-s]"
    banip: "&6Использование: &e/banip <игрок|IP> [срок] [причина] [-s]"
    unban: "&6Использование: &e/unban <игрок> [причина]"
    unbanip: "&6Использование: &e/unbanip <IP> [причина]"
    mute: "&6Использование: &e/mute <игрок> [срок] [причина] [-s]"
    unmute: "&6Использование: &e/unmute <игрок> [причина]"
    kick: "&6Использование: &e/kick <игрок> [причина] [-s]"
    warn: "&6Использование: &e/{label} <игрок> [причина] [-s]"
    unwarn: "&6Использование: &e/{label} <игрок> [ID | причина]"
    warnoff: "&6Использование: &e/{label} <игрок> [причина] [-s]"
    banoff: "&6Использование: &e/{label} <игрок> [срок] [причина] [-s]"
    muteoff: "&6Использование: &e/{label} <игрок> [срок] [причина] [-s]"
    history: "&6Использование: &e/history <игрок> [страница]"

  # Сообщения об успехе
  success:
    ban-issued: "&aИгрок &e{player} &aуспешно заблокирован."
    banip-issued: "&aIP-блокировка для &e{target} &aуспешно установлена."
    mute-issued: "&aИгрок &e{player} &aуспешно замучен."
    kick-issued: "&aИгрок &e{player} &aуспешно исключен с сервера."
    warn-issued: "&aПредупреждение игроку &e{player} &aуспешно выдано!"
    unban-done: "&aИгрок &e{player} &aуспешно разблокирован."
    unbanip-done: "&aIP-адрес &e{ip} &aуспешно разблокирован."
    unmute-done: "&aС игрока &e{player} &aуспешно снята блокировка чата."
    unwarn-issued: "&aПредупреждение с игрока &e{player} &aуспешно снято!"
    reload: "&aКонфигурация плагина CustomPunish успешно перезагружена!"

  # Ошибки
  error:
    no-permission: "&cУ вас недостаточно прав для выполнения этой команды!"
    silent-no-permission: "&cУ вас нет прав на использование тихого режима (-s)!"
    target-exempt: "&cВы не можете наказать игрока &e{player}&c, так как он защищен от наказаний!"
    no-limit-configured: "&cДля вашей роли в LuckPerms не задан лимит времени наказания! Обратитесь к администратору."
    duration-exceeded: "&cУказанный срок (&e{duration}&c) превышает ваш максимальный лимит (&e{max_duration}&c)!"
    permanent-forbidden: "&cВам запрещено выдавать постоянные наказания! Ваш максимум: &e{max_duration}"
    player-not-online: "&cИгрок &e{player} &cсейчас не в сети!"
    player-data-not-found: "&cИгрок &e{player} &cни разу не заходил на сервер, его IP-адрес неизвестен!"
    not-banned: "&cИгрок &e{player} &cне имеет активных блокировок!"
    not-banned-ip: "&cДля IP-адреса &e{ip} &cнет активных блокировок!"
    not-muted: "&cУ игрока &e{player} &cнет активной блокировки чата!"
    unwarn-not-found: "&cУ игрока &e{player} &cнет активных предупреждений!"
